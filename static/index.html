<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuwait Market — منصة التجارة الإلكترونية</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <nav class="nav">
    <a href="#" class="logo" onclick="go('home')">
      <img src="/logo.png" alt="Kuwait Market" style="height:40px;vertical-align:middle">
      <span style="color:var(--blue)">Kuwait</span> <span style="color:var(--orange)">Market</span>
    </a>
    <div class="nav-links" id="navLinks">
      <a onclick="go('home')">الرئيسية</a>
      <a onclick="go('products')">المنتجات</a>
      <a href="#how">كيف أبدأ؟</a>
      <a href="#features">المميزات</a>
      <!-- أزرار الضيف -->
      <span id="guestBtns">
        <a class="btn ghost sm" onclick="openAuth('login')">تسجيل دخول</a>
        <a class="btn sm" onclick="openAuth('register')">سجّل الآن</a>
      </span>
      <!-- أزرار المستخدم -->
      <span id="userBtns" class="hidden" style="display:flex;gap:12px;align-items:center">
        <a class="btn ghost sm" onclick="openOrder()">🛒<span id="cartCount" class="cart-badge">0</span></a>
        <a class="btn blue sm" id="dashLink" onclick="go('dashboard')">لوحتي</a>
        <a class="muted" style="cursor:pointer" onclick="logout()">خروج</a>
      </span>
    </div>
  </nav>
</header>

<main id="app"></main>

<!-- نافذة الدخول/التسجيل -->
<div class="overlay" id="authModal">
  <div class="modal">
    <button class="x" onclick="closeAuth()">×</button>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchAuth('login')">دخول</button>
      <button id="tabReg" onclick="switchAuth('register')">حساب جديد</button>
    </div>
    <div id="authAlert"></div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field"><label>الإيميل أو رقم الهاتف</label><input id="loginEmail" required></div>
      <div class="field"><label>كلمة المرور</label>
        <div style="position:relative">
          <input id="loginPass" type="password" required style="padding-left:42px">
          <span onclick="togglePw('loginPass',this)" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;font-size:18px">👁️</span>
        </div></div>
      <button class="btn" style="width:100%;justify-content:center">دخول</button>
    </form>
    <form id="regForm" class="hidden" onsubmit="return doRegister(event)">
      <div class="field"><label>الاسم</label><input id="regName" required></div>
      <div class="field"><label>الإيميل</label><input id="regEmail" type="email" required></div>
      <div class="field"><label>رقم الهاتف</label><input id="regPhone"></div>
      <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label>
        <div style="position:relative">
          <input id="regPass" type="password" required style="padding-left:42px">
          <span onclick="togglePw('regPass',this)" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;font-size:18px">👁️</span>
        </div></div>
      <button class="btn" style="width:100%;justify-content:center">إنشاء الحساب</button>
    </form>
  </div>
</div>

<!-- نافذة تفاصيل المنتج -->
<div class="overlay" id="productModal">
  <div class="modal" id="productModalBody"></div>
</div>

<!-- نافذة إتمام الطلب -->
<div class="overlay" id="orderModal">
  <div class="modal wide">
    <button class="x" onclick="closeOrder()">×</button>
    <h2>إتمام الطلب للعميل</h2>
    <div id="orderAlert"></div>
    <div id="cartItems"></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
    <h3 style="color:var(--blue);margin-bottom:12px">بيانات العميل</h3>
    <form id="orderForm" onsubmit="return submitOrder(event)">
      <div class="field"><label>اسم العميل</label><input id="custName" required></div>
      <div class="field"><label>رقم هاتف العميل</label><input id="custPhone" required></div>
      <div class="field"><label>المدينة / المنطقة (اكتب للبحث)</label>
        <input id="custCity" list="cityList" autocomplete="off" placeholder="ابحث باسم المنطقة..." oninput="onCityChange()" required>
        <datalist id="cityList"></datalist>
        <div id="cityInfo" class="muted" style="font-size:13px;margin-top:4px"></div>
      </div>
      <div class="field"><label>العنوان بالتفصيل</label><textarea id="custAddr" rows="2" required></textarea></div>
      <div style="background:#f8fafc;border-radius:12px;padding:12px 16px;margin:14px 0">
        <div class="row-between"><span>سعر المنتجات</span><span id="ordSub" style="font-weight:700">0</span></div>
        <div class="row-between"><span>التوصيل</span><span id="ordDel" style="font-weight:700">0</span></div>
        <div class="row-between" style="font-size:18px;font-weight:800;color:var(--orange);border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><span>الإجمالي</span><span id="ordTotal">0</span> <span>د.ك</span></div>
      </div>
      <button class="btn green" style="width:100%;justify-content:center">تأكيد الطلب</button>
    </form>
  </div>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
